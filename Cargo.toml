[workspace]
members = [
    "crates/engine_core",
    "crates/script_editor",
    "crates/game_player",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
rmp-serde = "1"
anyhow = "1"
thiserror = "2"
log = "0.4"
env_logger = "0.11"
rand = { version = "0.8", features = ["std", "std_rng", "getrandom"] }
rand_chacha = "0.3"
rand_xoshiro = "0.6"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "warn"
