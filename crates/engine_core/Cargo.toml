[package]
name = "engine_core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
autotests = false

[dependencies]
serde = { workspace = true }
rmp-serde = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
raw-window-handle = "0.6.2"
winit = "0.30.13"
kira = { version = "0.12.0", optional = true }
csv = "1.4.0"
rand = { workspace = true }
rand_chacha = { workspace = true }
rand_xoshiro = { workspace = true }

[lints]
workspace = true

[build-dependencies]
cc = "1"

[features]
default = ["audio-kira"]
# 実出力（`cpal` / Linux では ALSA 等がランタイム・ビルドに関与しうる）。
audio-kira = ["dep:kira"]
# Filament を有効にする場合だけ、build.rs がリンク設定を行う。
filament = []
winit = []

[[test]]
name = "filament_smoke"
path = "tests/filament_smoke.rs"
required-features = ["filament"]

[[test]]
name = "audio_command_drain"
path = "tests/audio_command_drain.rs"
